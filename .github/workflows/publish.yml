name: Build

# Публикация убрана: релизы выкладываются вручную.
#
# Что тут было и почему снято:
#   • ./gradlew build publish — задача publish льёт артефакты в мавен
#     апстрима (repo.redlance.org). Секретов MAVEN_USERNAME/PASSWORD в
#     форке нет, поэтому шаг падал с ошибкой авторизации на каждом пуше;
#   • шаги Modrinth и CurseForge — там стояли идентификаторы проектов
#     АПСТРИМА (modrinth 2gvRmQXx, curseforge 570017). До них сборка не
#     доходила, но оставлять их в форке нельзя было в любом случае;
#   • генератор чейнджлога и чтение gradle.properties нужны были только
#     тем шагам и ушли вместе с ними.
#
# Осталась сборка. Она полезна сама по себе: ловит ошибки компиляции до
# того, как о них узнаешь локально, — например расхождения Fabric и Forge
# при переносе миксинов из апстрима.
#
# Готовые джарники кладутся в артефакты запуска, оттуда их и забирать
# для ручной публикации.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # fetch-depth: 0 больше не нужен: полная история требовалась
      # только для git describe в генераторе чейнджлога.
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      # if-no-files-found: error — чтобы «зелёная» сборка без джарников
      # не проходила молча.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: radium-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
